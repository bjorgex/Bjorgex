<style>.l{fill:none;stroke:#57606a;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-in-out forwards}
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328;font-weight:700;font-size:38px;opacity:0;animation:f 1.4s ease-out 1.6s forwards}
